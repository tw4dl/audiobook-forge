[package]
name = "kokoro-book"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A small offline EPUB and text-to-audiobook CLI powered by Kokoro"
license = "Apache-2.0"
repository = "https://github.com/tw4dl/kokoro-book"
keywords = ["audiobook", "epub", "kokoro", "tts"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.60", features = ["derive"] }
directories = "6.0.0"
hound = "3.5.1"
html2text = "0.17.1"
indicatif = "0.18.3"
misaki-rs = { version = "0.3.0", default-features = false }
ndarray = "0.17.2"
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["copy-dylibs", "download-binaries", "ndarray", "std", "tls-rustls"] }
rbook = { version = "0.7.10", default-features = false }
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }

[dev-dependencies]
assert_cmd = "2.1.2"
predicates = "3.1.3"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
